<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sench Sanch Sales Tracker — Sign in</title>
<style>
    :root {
        --bg: #f4f8ff;
        --card: #fffdf9;
        --blue-deep: #0b3d91;
        --blue-soft: #1456b8;
        --blue: #1565d8;
        --blue-light: #2f80ed;
        --text: #1f2a24;
        --muted: #64748b;
        --border: #dbeafe;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 20% 15%, #dbeafe 0%, #f4f8ff 55%), var(--bg);
        font-family: 'Segoe UI', Arial, sans-serif;
        color: var(--text);
        padding: 1.5rem;
    }
    .login-card {
        width: 100%;
        max-width: 380px;
        background: var(--blue-deep);
        border-radius: 20px;
        padding: 2.5rem 2rem;
        color: #ffffff;
        box-shadow: 0 0 0 1px rgba(21,101,216,0.08), 0 25px 60px rgba(0,0,0,0.55), 0 0 40px rgba(21,101,216,0.06);
    }
    .mark {
        width: 44px; height: 44px;
        background: var(--blue-light);
        border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.3rem;
        margin-bottom: 1.5rem;
        box-shadow: 0 0 24px rgba(47,128,237,0.35);
    }
    .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--blue-light);
        margin: 0 0 0.5rem;
    }
    h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.9rem;
        line-height: 1.2;
        margin: 0 0 0.6rem;
    }
    .subtitle {
        color: #dbeafe;
        font-size: 0.92rem;
        line-height: 1.5;
        margin: 0 0 2rem;
    }
    label {
        display: block;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #dbeafe;
        margin-bottom: 0.4rem;
    }
    .field { margin-bottom: 1.1rem; }
    input {
        width: 100%;
        padding: 0.8rem 0.9rem;
        border: 1px solid rgba(21,101,216,0.18);
        border-radius: 10px;
        background: rgba(245, 239, 227, 0.06);
        color: #ffffff;
        font-size: 0.95rem;
    }
    input::placeholder { color: #94a3b8; }
    input:focus {
        outline: none;
        border-color: var(--blue-light);
        background: rgba(245, 239, 227, 0.1);
    }
    button {
        width: 100%;
        margin-top: 0.75rem;
        padding: 0.85rem 1rem;
        border: none;
        border-radius: 999px;
        background: var(--blue);
        color: #1f2a24;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        transition: background 0.15s ease;
    }
    button:hover { background: var(--blue-light); }
    .error {
        background: rgba(220, 90, 60, 0.15);
        border: 1px solid rgba(220, 90, 60, 0.4);
        color: #f3b8a6;
        padding: 0.7rem 0.9rem;
        border-radius: 10px;
        font-size: 0.85rem;
        margin-bottom: 1.25rem;
    }
    .hint {
        margin-top: 1.75rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgba(245, 239, 227, 0.12);
        font-size: 0.78rem;
        color: #94a3b8;
        letter-spacing: 0.02em;
    }

/* Sench Sanch Sales Tracker — Blue & White theme */
body { background: linear-gradient(135deg, #f4f8ff 0%, #ffffff 55%, #eaf2ff 100%) !important; }
button, .btn, .primary, .submit-btn { background: #1565d8 !important; color: #ffffff !important; }
button:hover, .btn:hover, .primary:hover, .submit-btn:hover { background: #0b3d91 !important; }
input:focus, select:focus { border-color: #1565d8 !important; box-shadow: 0 0 0 3px rgba(21,101,216,.12); }

</style>
</head>
<body>
    <div class="login-card">
        <div class="mark">🧾</div>
        <p class="eyebrow">Sench Sanch Sales Tracker</p>
        <h1>Welcome back to the counter.</h1>
        <p class="subtitle">Sign in to record today's sales and keep the running totals — and profit — live.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="manager" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Sign in →</button>
        </form>

        <p class="hint">Shop sales desk · access is limited to staff on shift</p>
    </div>
</body>
</html>
