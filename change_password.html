<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ settings.shop_name }} — Change password</title>
<style>
    :root {
        --bg: #f4f8ff; --card: #ffffff; --blue-deep: #0b3d91; --blue-soft: #1456b8;
        --blue: #1565d8; --blue-light: #2f80ed; --text: #0f172a; --muted: #64748b;
        --border: rgba(21,101,216,0.12); --red: #f87171; --green: #34d399;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 20% 15%, #dbeafe 0%, #f4f8ff 55%), var(--bg);
        font-family: 'Segoe UI', Arial, sans-serif; color: var(--text); padding: 1.5rem;
    }
    .card {
        width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border);
        border-radius: 20px; padding: 2rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .back-link { display: inline-block; margin-bottom: 1.2rem; color: var(--muted); text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { color: var(--text); }
    .eyebrow { text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.7rem; font-weight: 700; color: var(--blue-light); margin: 0 0 0.4rem; }
    h1 { font-family: Georgia, serif; font-size: 1.5rem; margin: 0 0 0.4rem; }
    .subtitle { color: var(--muted); font-size: 0.88rem; margin: 0 0 1.5rem; }
    label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.35rem; }
    .field { margin-bottom: 1rem; }
    input {
        width: 100%; padding: 0.7rem 0.85rem; border: 1px solid var(--border); border-radius: 10px;
        background: #f8fbff; font-size: 0.95rem; color: var(--text);
    }
    input:focus { outline: none; border-color: var(--blue); }
    button {
        width: 100%; padding: 0.8rem; border: none; border-radius: 999px; background: var(--blue);
        color: #1c1305; font-weight: 700; font-size: 0.92rem; cursor: pointer; margin-top: 0.4rem;
    }
    button:hover { background: var(--blue-light); }
    .msg { padding: 0.7rem 0.9rem; border-radius: 10px; font-size: 0.85rem; margin-bottom: 1.2rem; }
    .msg.error { background: rgba(248,113,113,0.12); color: #fca5a5; border: 1px solid rgba(248,113,113,0.3); }
    .msg.success { background: rgba(52,211,153,0.12); color: #6ee7b7; border: 1px solid rgba(52,211,153,0.3); }

/* Sench Sanch Sales Tracker — Blue & White theme */
body { background: linear-gradient(135deg, #f4f8ff 0%, #ffffff 55%, #eaf2ff 100%) !important; }
button, .btn, .primary, .submit-btn { background: #1565d8 !important; color: #ffffff !important; }
button:hover, .btn:hover, .primary:hover, .submit-btn:hover { background: #0b3d91 !important; }
input:focus, select:focus { border-color: #1565d8 !important; box-shadow: 0 0 0 3px rgba(21,101,216,.12); }

</style>
</head>
<body>
    <div class="card">
        <a href="{{ url_for('index') }}" class="back-link">← Back to the desk</a>
        <p class="eyebrow">Account</p>
        <h1>Change your password</h1>
        <p class="subtitle">Signed in as {{ user.display_name }}</p>

        {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
        {% if success %}<div class="msg success">{{ success }}</div>{% endif %}

        <form method="POST" action="{{ url_for('change_password') }}">
            <div class="field">
                <label for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="field">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" minlength="6" required>
            </div>
            <div class="field">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
            </div>
            <button type="submit">Update password</button>
        </form>
    </div>
</body>
</html>
